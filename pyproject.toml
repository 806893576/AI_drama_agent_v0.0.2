[project]
name = "drama-agent-platform"
version = "0.0.3"
description = "LangGraph-based AI short drama production planning agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "langgraph",
    "pydantic",
    "PyYAML",
    "uvicorn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
