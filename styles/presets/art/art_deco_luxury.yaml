name: "装饰艺术奢华"
aliases: "Art Deco,art deco,装饰艺术,黑金奢华,复古饭店,爵士时代,豪门奢华"
visual_style_profile: "几何对称、黑金配色、金属线条、阶梯形装饰、镜面材质和复古剧院/酒店空间，呈现秩序化奢华。"
director_style_profile: ""
cinematography_profile: "镜头强调轴线、对称、门厅纵深、楼梯和镜面反射，人物常被奢华空间框住。"
lighting_profile: "暖金灯光、抛光反射、壁灯和吊灯形成层次，暗部干净，金属高光清晰。"
color_palette: "黑、金、象牙白、祖母绿、酒红和深蓝，避免廉价大面积亮黄。"
art_direction_profile: "场景适合豪门、饭店、剧院、赌场、董事会和复古商业空间，道具几何化、材质高级。"
render_style: "Art Deco装饰艺术，复古奢华，几何对称，金属与镜面材质。"
performance_profile: ""
editing_rhythm: ""
sound_profile: ""
vfx_profile: "特效克制，可使用金属反光、镜面转场、灯光扫过和复古字幕卡。"
style_do: "保持对称构图、几何装饰和高级材质；用空间表达权力和阶层。"
style_do_not: "不要把奢华做成杂乱堆金；不要出现真实奢侈品牌标识。"
safety_notes: "所有品牌、酒店、珠宝、酒标和商标必须虚构。"
