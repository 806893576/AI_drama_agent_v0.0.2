preset_id: "paper_cutout"
preset_type: "art"
name: "剪纸定格"
aliases: "剪纸风,纸片动画,cutout animation,paper cutout,皮影"
visual_style_profile: "平面纸张、剪裁边缘、分层景片、纸纹和投影清晰，角色由可动纸片部件构成。"
director_style_profile: ""
cinematography_profile: "构图偏平面舞台化，横向调度、层间移动和遮挡关系清楚。"
lighting_profile: "侧光或顶光打出纸张层次阴影，保留纸边厚度和手工质感。"
color_palette: "可使用民间剪纸高对比色，也可使用现代低饱和纸张色，但必须有明确主色。"
art_direction_profile: "场景像纸剧场，人物、道具、背景分层，图形语言简洁。"
render_style: "二维剪纸定格，纸张纹理，分层投影，手工边缘。"
performance_profile: ""
editing_rhythm: ""
sound_profile: ""
vfx_profile: "特效用纸屑、纸片翻转、影子变化和层间遮挡表现。"
style_do: "保持纸张材质和层次；让动作像纸偶逐格移动。"
style_do_not: "不要做成光滑矢量扁平插画；不要加入真实三维复杂材质。"
safety_notes: "如引用传统民俗图案，避免误用真实宗教、民族符号和商标图形。"
