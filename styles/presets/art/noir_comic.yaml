name: "黑色漫画"
aliases: "黑色漫画,noir comic,硬派漫画,高反差漫画,美漫 noir"
visual_style_profile: "高反差黑白或有限色漫画，厚重阴影、斜线排线、雨夜街道、强烈人物轮廓。"
director_style_profile: ""
cinematography_profile: "低机位、百叶窗阴影、门框遮挡、背光剪影和压迫式特写。"
lighting_profile: "硬光、高反差、大片黑影和局部高光，脸部常被阴影切割。"
color_palette: "黑白灰为主，可用红、黄或蓝作为少量情绪色。"
art_direction_profile: "场景强调街巷、办公室、霓虹、烟雾和硬质道具，人物服装轮廓鲜明。"
render_style: "漫画分镜质感，粗线条，高反差阴影，印刷网点或排线。"
performance_profile: ""
editing_rhythm: ""
sound_profile: ""
vfx_profile: "特效用漫画速度线、拟声字的抽象图形感和烟雾阴影变化表现。"
style_do: "保持强轮廓、硬阴影和有限色策略。"
style_do_not: "不要变成柔和写实偶像剧光线；不要滥用彩色渐变。"
safety_notes: "避免复刻具体漫画超级英雄、标志、服装和城市名称。"
