preset_id: "cinematic_short_drama"
preset_type: "art"
name: "默认电影感短剧"
aliases: "电影感,短剧电影感,写实短剧,默认风格"
visual_style_profile: "写实短剧质感，画面干净、人物辨识度高、服化道贴近现实但比生活略精致，适合竖屏或横屏短视频快速理解。"
director_style_profile: ""
cinematography_profile: "以清晰叙事为优先，中近景和特写占比高，关键情绪点用轻微推进或焦点转移强化。"
lighting_profile: "自然动机光为主，必要时加入柔和轮廓光和轻微冷暖对比，保证人物脸部信息清楚。"
color_palette: "中性色基础，局部用高饱和道具或环境色强调冲突，避免整体颜色过灰或过曝。"
art_direction_profile: "场景陈设简洁可拍，关键道具明确，服装体现身份、阶层和剧情状态。"
render_style: "超写实商业影像，高清细节，16:9 或平台所需比例。"
performance_profile: ""
editing_rhythm: ""
sound_profile: ""
vfx_profile: "只在手机屏幕、短信、转场信息和必要氛围强化处加入轻量特效。"
style_do: "优先保证人物、道具、场景关系一眼可读；角色服装和妆面随剧情状态变化。"
style_do_not: "不要过度电影化导致信息看不清；不要加入和剧情无关的装饰性元素。"
safety_notes: "避免真实品牌、真实明星肖像、版权角色相似造型。"
