preset_id: "watercolor_picturebook"
preset_type: "art"
name: "水彩绘本"
aliases: "水彩,绘本风,童话绘本,watercolor,picturebook"
visual_style_profile: "透明水彩晕染、纸张纹理、柔和边缘、留白充足，画面温柔且富有文学感。"
director_style_profile: ""
cinematography_profile: "镜头像翻阅绘本页面，构图留有呼吸感，情绪转折用环境色变化表达。"
lighting_profile: "光影轻柔，不追求强硬高反差，阴影像水彩层层叠加。"
color_palette: "低饱和 pastel、湿画法渐变、温柔自然色，避免强荧光。"
art_direction_profile: "场景和道具简化成有叙事象征的绘本元素，细节不过密。"
render_style: "水彩插画，纸纹，柔边，透明颜料层次。"
performance_profile: ""
editing_rhythm: ""
sound_profile: ""
vfx_profile: "特效像水彩扩散、墨迹、纸面光斑和翻页转场。"
style_do: "用色彩和留白承托情绪；保持纸张纹理一致。"
style_do_not: "不要做成油画厚涂、赛博霓虹或真实摄影。"
safety_notes: "避免复刻具体绘本 IP 的角色比例和造型。"
