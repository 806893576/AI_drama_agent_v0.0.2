preset_id: "felted_wool"
preset_type: "art"
name: "毛毡定格"
aliases: "毛毡风,羊毛毡,毛绒定格,needle felt,felting"
visual_style_profile: "柔软毛毡材质、可见纤维、手作边缘、微小不完美，整体温暖、触感强、像实物微缩布景。"
director_style_profile: ""
cinematography_profile: "镜头像拍摄微缩定格模型，运动幅度小，角色姿态变化清楚，保留手作质感。"
lighting_profile: "柔和棚拍光，轻微侧光显出毛绒纤维和体积，阴影软而干净。"
color_palette: "低饱和暖色、奶油色、柔和糖果色和天然织物色。"
art_direction_profile: "场景、人物、道具都像手工缝制或针毡制作，比例略可爱化。"
render_style: "毛毡手作定格动画质感，微缩布景，纤维材质清晰。"
performance_profile: ""
editing_rhythm: ""
sound_profile: ""
vfx_profile: "尽量用实物感机关、棉絮、纸片、线绳表现效果，不做数字感强的粒子特效。"
style_do: "强调触感、纤维、手作痕迹和温柔空间。"
style_do_not: "不要生成光滑塑料、真实真人皮肤或高科技金属质感。"
safety_notes: "儿童向或治愈向表达应避免惊吓和侵害性画面。"
