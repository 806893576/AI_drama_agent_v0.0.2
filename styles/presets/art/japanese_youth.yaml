preset_id: "japanese_youth"
preset_type: "art"
name: "日式青春"
aliases: "日式青春,青春校园,夏日青春,清新青春,日系青春"
visual_style_profile: "清澈、克制、带季节感的青春影像，人物情绪通过微表情、校服/便服细节、风、阳光和空镜承托。"
director_style_profile: ""
cinematography_profile: "多用平视、侧脸、背影和隔着窗/走廊的观察视角，情绪转折用安静特写和留白。"
lighting_profile: "自然日光、窗边逆光、傍晚金色边缘光和雨天柔光，整体光线温柔但不过曝。"
color_palette: "浅蓝、白、草绿、暖黄、淡粉等低饱和清爽色，按季节加入樱花、海边或黄昏色。"
art_direction_profile: "场景以教室、天台、街角、便利店、海边、车站等日常地点为主，细节干净、有生活痕迹。"
render_style: "可写实、赛璐璐或轻插画化，但必须保留清透空气感。"
performance_profile: ""
editing_rhythm: ""
sound_profile: ""
vfx_profile: "只使用风吹窗帘、光斑、雨滴、纸张轻动等自然细节，不做夸张奇观。"
style_do: "用环境和停顿表达未说出口的情绪；保持青春感、清洁感和季节感。"
style_do_not: "不要把青春风格做成过度糖水、过度滤镜或成人商业广告质感。"
safety_notes: "涉及校园和未成年人时，服装、动作和镜头必须保持健康、非性化表达。"
