preset_id: "motion_graphics_vector"
preset_type: "art"
name: "动态图形矢量"
aliases: "motion graphics,动态图形,MG动画,矢量动画,信息图动画,动效图形,扁平动效"
visual_style_profile: "干净矢量形状、图标、线条、色块、信息层级和动态排版构成画面，强调信息传达和节奏感。"
director_style_profile: ""
cinematography_profile: "镜头像设计版面切换，使用平移、缩放、遮罩、图形转场和信息层级推进叙事。"
lighting_profile: "通常不用写实光影，依靠色块、阴影层、透明度和层级关系建立空间。"
color_palette: "品牌化或主题化色板，主色、辅助色和警示色分工明确，保持高可读性。"
art_direction_profile: "人物可图标化或几何化，场景可抽象成地图、界面、流程图、聊天框和数据面板。"
render_style: "矢量动态图形，清晰边缘，简洁图标，动态图层，适合短视频信息流。"
performance_profile: ""
editing_rhythm: ""
sound_profile: "可用点击声、弹出声、界面提示音和节拍音效增强图形节奏。"
vfx_profile: "特效以图形遮罩、路径动画、文字动效、UI弹窗和数据流为主。"
style_do: "所有图形和文字必须服务剧情信息；重要内容留足阅读时间。"
style_do_not: "不要堆砌无意义图标；不要让动效遮挡对白、人物关系或剧情关键线索。"
safety_notes: "界面、logo、品牌色、地图和软件窗口均使用虚构设计，避免真实产品商标。"
