preset_id: "cel_animation"
preset_type: "art"
name: "赛璐璐动画"
aliases: "赛璐璐,cel animation,二次元动画,日漫动画,手绘动画"
visual_style_profile: "清晰线稿、平涂色块、边缘干净、角色轮廓辨识度强，背景比角色略低细节以突出表演。"
director_style_profile: ""
cinematography_profile: "镜头以明确构图和角色姿态为核心，动作关键帧清楚，情绪特写强调眼神和停顿。"
lighting_profile: "阴影使用干净分层，少量硬边投影和高光块面，不使用复杂写实反射。"
color_palette: "明快但受控的色块体系，主角色、场景色和情绪色区分明确。"
art_direction_profile: "服装、发型、道具都要有可重复绘制的简化形状，避免过密纹理。"
render_style: "二维赛璐璐动画渲染，清晰描线，平面色块，干净阴影。"
performance_profile: ""
editing_rhythm: ""
sound_profile: ""
vfx_profile: "特效使用手绘感速度线、光点、冲击线和简洁能量块，不使用写实粒子堆叠。"
style_do: "保持角色比例、发型轮廓、服装主色在所有资产和分镜中一致。"
style_do_not: "不要生成真实摄影质感；不要把阴影和材质做得过度写实。"
safety_notes: "不要接近具体版权动画角色、校服纹章、片厂标识或可识别 IP 造型。"
