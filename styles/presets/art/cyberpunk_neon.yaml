preset_id: "cyberpunk_neon"
preset_type: "art"
name: "赛博霓虹"
aliases: "赛博朋克,cyberpunk,霓虹未来,未来都市,neon noir"
visual_style_profile: "高密度未来都市、霓虹招牌、雨夜反射、电子屏、金属与潮湿街面并置，人物被技术环境压迫。"
director_style_profile: ""
cinematography_profile: "多用广角城市纵深、低机位、玻璃反射、遮挡构图和快速信息切换。"
lighting_profile: "霓虹侧光、屏幕光、雨夜反射和强色彩边缘光，暗部保留层次。"
color_palette: "青蓝、品红、紫、酸性绿和黑色湿街反射，避免单色铺满。"
art_direction_profile: "服装和道具结合街头、科技、磨损和阶层差异，屏幕文字使用虚构信息。"
render_style: "未来都市写实或动画化均可，但必须保留霓虹、潮湿、科技压迫感。"
performance_profile: ""
editing_rhythm: ""
sound_profile: "电子低频、城市噪声、屏幕提示音和远处交通声形成背景压力。"
vfx_profile: "使用全息界面、屏幕反射、数据噪点和雨雾光晕，但不覆盖人物表演。"
style_do: "保持科技细节、雨夜材质和霓虹方向连续。"
style_do_not: "不要堆满无意义 UI；不要使用真实品牌标识和可读真实商标。"
safety_notes: "所有屏幕、招牌、企业名和系统界面必须为虚构内容。"
