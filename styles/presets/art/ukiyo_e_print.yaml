preset_id: "ukiyo_e_print"
preset_type: "art"
name: "浮世绘版画"
aliases: "浮世绘,ukiyo-e,日本版画,江户版画,木版画,妖怪版画"
visual_style_profile: "平面构图、清晰墨线、大色块、木版纹理、装饰性云浪纹和舞台化人物姿态，画面像现代化浮世绘版画。"
director_style_profile: ""
cinematography_profile: "镜头偏平面横向调度和卷轴式展开，重点动作像版画中的姿态定格。"
lighting_profile: "不追求写实光照，用色块深浅、线条密度和背景纹样表现明暗与空间。"
color_palette: "靛蓝、朱红、米白、墨黑、赭石、青绿等传统版画色，主色控制明确。"
art_direction_profile: "服装纹样、建筑、云、水、山、妖怪或市井道具都要图案化，避免现代杂乱真实纹理。"
render_style: "浮世绘木版画质感，平面色块，清晰墨线，纸张肌理，东方怪谈或江户市井气质。"
performance_profile: ""
editing_rhythm: ""
sound_profile: ""
vfx_profile: "特效用版画波纹、纸纹抖动、墨线扩散、云纹遮挡和卷轴转场表现。"
style_do: "保持平面性、装饰线条和纸张版画感；人物姿态要有戏剧定格感。"
style_do_not: "不要混入真实摄影透视和照片级皮肤；不要直接复刻具体历史名作构图。"
safety_notes: "传统图案和妖怪元素需做原创组合，避免复制受版权保护的现代插画或角色。"
