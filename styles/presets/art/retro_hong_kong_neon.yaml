preset_id: "retro_hong_kong_neon"
preset_type: "art"
name: "复古港风霓虹"
aliases: "港风,复古港风,香港霓虹,80年代香港,港片美术"
visual_style_profile: "拥挤城市街巷、霓虹灯牌、茶餐厅、旧楼梯间、胶片颗粒和生活化杂物并存，热闹中带危险和暧昧。"
director_style_profile: ""
cinematography_profile: "用玻璃、雨夜街面、窄巷纵深和低角度表现城市压迫。"
lighting_profile: "霓虹红蓝绿、钨丝暖光、街灯反射和烟雾扩散，人物脸部保留局部暗影。"
color_palette: "猩红、霓虹蓝、祖母绿、钨丝黄、黑色雨夜反射。"
art_direction_profile: "服装可带皮衣、衬衫、牛仔、复古发型和旧时代街头质感，道具避免真实商标。"
render_style: "复古胶片港风，轻微颗粒，霓虹夜景，城市生活质感。"
performance_profile: ""
editing_rhythm: ""
sound_profile: ""
vfx_profile: "只使用胶片颗粒、招牌闪烁、雨雾反光和轻微光晕。"
style_do: "保持街头生活细节、霓虹色和胶片质感统一。"
style_do_not: "不要把港风简化为单一红蓝滤镜；不要出现真实店招和品牌。"
safety_notes: "街景招牌和店名均使用虚构文字，避免现实品牌和受保护标志。"
