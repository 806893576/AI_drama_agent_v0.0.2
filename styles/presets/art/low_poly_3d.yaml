preset_id: "low_poly_3d"
preset_type: "art"
name: "低多边形三维"
aliases: "低多边形,low poly,low-poly,几何三维,低模3D,简化几何"
visual_style_profile: "低多边形几何块面、清晰轮廓、简化体积和低细节材质，画面像游戏过场或寓言式三维短片。"
director_style_profile: ""
cinematography_profile: "镜头保持空间关系清楚，多用稳定推拉、环绕和俯视构图展示几何体块与人物路线。"
lighting_profile: "大面积柔和环境光配合清晰方向光，阴影简洁，突出几何切面。"
color_palette: "有限但明确的主色板，低饱和自然色或高识别糖果色均可，避免复杂渐变。"
art_direction_profile: "角色、场景、道具都由可读几何体构成，建筑和自然物保留块面折线，关键道具使用更高对比颜色。"
render_style: "低多边形3D，简化几何，硬边切面，轻量材质，16:9或平台所需比例。"
performance_profile: ""
editing_rhythm: ""
sound_profile: ""
vfx_profile: "特效用几何碎片、低模粒子、块面光束和简单体积雾表现，不使用写实流体或复杂爆炸。"
style_do: "保持模型面数、材质复杂度和轮廓语言统一；让角色动作和道具状态一眼可读。"
style_do_not: "不要混入高写实皮肤、复杂毛发、照片级材质或过密纹理。"
safety_notes: "避免复刻具体游戏角色、地图、UI和受版权保护的低模造型。"
