preset_id: "pop_art_comic"
preset_type: "art"
name: "波普漫画"
aliases: "Pop Art,pop art,波普,波普艺术,漫画网点,复古广告漫画"
visual_style_profile: "高饱和原色、粗黑线、半调网点、商品化符号、夸张表情和广告海报感，适合讽刺消费主义和网红题材。"
director_style_profile: ""
cinematography_profile: "镜头像漫画格和广告页切换，使用硬切、定格、分屏和拟声字图形强化爆点。"
lighting_profile: "平面化高亮度，阴影简洁硬边，人物像印刷海报而非真实摄影。"
color_palette: "红、黄、蓝、黑、白为基础，可加入粉色和青色，保持强对比。"
art_direction_profile: "道具和场景可带商品橱窗、包装、海报、社交媒体符号，但所有品牌必须虚构。"
render_style: "波普漫画，半调网点，粗线条，高饱和广告色，复古印刷感。"
performance_profile: ""
editing_rhythm: ""
sound_profile: "可使用拟声字音效、广告 jingle 感和夸张转场音。"
vfx_profile: "特效用漫画爆炸框、拟声字、半调网点扩散、分屏和印刷错位。"
style_do: "让色彩、文字和图形承担讽刺或情绪功能；保持漫画格阅读清楚。"
style_do_not: "不要使用真实商品包装、真实品牌标识或过密文字。"
safety_notes: "所有商品、广告、社交平台界面和商标都必须原创化。"
