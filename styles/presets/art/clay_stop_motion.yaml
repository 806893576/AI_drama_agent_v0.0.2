preset_id: "clay_stop_motion"
preset_type: "art"
name: "黏土定格"
aliases: "黏土动画,claymation,stop motion,定格动画,泥塑"
visual_style_profile: "黏土塑形、可见指纹和压痕、实体微缩场景，角色形体略夸张但触感真实。"
director_style_profile: ""
cinematography_profile: "镜头保持实体拍摄感，轻微低机位和微距质感突出模型尺度。"
lighting_profile: "棚拍软光配合局部硬光，显示黏土体积和表面压痕。"
color_palette: "手工颜料感和黏土固有色，颜色厚实，不追求透明空气感。"
art_direction_profile: "角色、场景、道具都像可触摸模型，材质略有不完美。"
render_style: "黏土定格动画，实体模型，手作痕迹，微缩布景。"
performance_profile: ""
editing_rhythm: ""
sound_profile: ""
vfx_profile: "爆炸、烟雾、水花等用实体替代材料或逐格变形表现。"
style_do: "保留定格低帧率、实体材质和手工变形。"
style_do_not: "不要做成光滑 CGI；不要隐藏所有手作痕迹。"
safety_notes: "如果面向儿童或家庭平台，惊悚元素应保持轻度和 stylized。"
