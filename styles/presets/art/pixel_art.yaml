preset_id: "pixel_art"
preset_type: "art"
name: "像素风"
aliases: "像素风,pixel art,8bit,16bit,复古游戏"
visual_style_profile: "低分辨率像素块、有限色板、清楚轮廓、角色和道具图形高度概括，画面像复古游戏过场。"
director_style_profile: ""
cinematography_profile: "镜头以横版、俯视、等距或固定场景切换为主，动作读法清晰。"
lighting_profile: "用有限色阶表现明暗，不使用写实渐变和复杂反射。"
color_palette: "受限色板，高识别主色，阴影和高光使用少量阶梯色。"
art_direction_profile: "角色、道具、场景都要能被压缩成清晰像素轮廓，关键物件用高对比颜色标记。"
render_style: "像素艺术，低分辨率块面，有限色板，锐利边缘。"
performance_profile: ""
editing_rhythm: ""
sound_profile: "可使用芯片音乐、短促音效和界面提示音，但需服务剧情。"
vfx_profile: "特效用像素粒子、闪烁、屏幕抖动和低帧率爆点表现。"
style_do: "保持像素尺寸、色板和轮廓一致；避免不同镜头分辨率漂移。"
style_do_not: "不要混入真实摄影、高模 3D 或柔焦电影镜头。"
safety_notes: "避免复刻具体游戏角色、UI、道具图标和受版权保护关卡布局。"
