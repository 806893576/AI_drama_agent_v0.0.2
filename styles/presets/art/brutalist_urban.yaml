preset_id: "brutalist_urban"
preset_type: "art"
name: "粗野主义都市"
aliases: "粗野主义,brutalist,brutalism,混凝土都市,冷峻建筑,反乌托邦都市"
visual_style_profile: "巨大的混凝土体块、裸露结构、冷灰色、压迫尺度和少量功能性标识，城市空间像权力机器。"
director_style_profile: ""
cinematography_profile: "多用仰拍、远景小人物、长走廊、巨墙遮挡和冷静对称构图突出压迫。"
lighting_profile: "冷硬自然光、顶光、阴天散射和混凝土阴影，保留材质粗糙度。"
color_palette: "混凝土灰、冷蓝、铁锈色、暗绿和少量警示橙，整体低饱和。"
art_direction_profile: "场景适合政府楼、旧工厂、地下通道、公司总部、学校或反乌托邦设施。"
render_style: "粗野主义建筑美术，混凝土质感，巨大尺度，冷峻都市空间。"
performance_profile: ""
editing_rhythm: ""
sound_profile: "环境声可有风声、空旷混响、荧光灯电流声、电梯和管道声。"
vfx_profile: "特效很少，必要时用监控屏、警示灯、灰尘和空间雾化增强压迫。"
style_do: "用空间尺度和材质压迫人物；保持结构、灰度和冷硬感统一。"
style_do_not: "不要加入过多温馨软装、霓虹糖果色或奢华装饰。"
safety_notes: "现实机构、学校、政府标识和企业logo均使用虚构设计。"
