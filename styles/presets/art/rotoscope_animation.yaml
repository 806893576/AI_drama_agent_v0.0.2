preset_id: "rotoscope_animation"
preset_type: "art"
name: "转描动画"
aliases: "转描,rotoscope,rotoscoping,真人转动画,描摹动画,写实动画化"
visual_style_profile: "以真人动作质感为基础，叠加手绘线条、色块或半写实笔触，身体运动真实但画面保留动画化边缘。"
director_style_profile: ""
cinematography_profile: "镜头可接近真人摄影，重视真实身体重心、表情变化和环境互动，动作细节比夸张变形更重要。"
lighting_profile: "可保留实拍式光影逻辑，再用手绘阴影、边缘线和局部色块统一画面。"
color_palette: "根据题材可写实低饱和或高风格化，但人物肤色、服装和背景需统一处理。"
art_direction_profile: "服装褶皱、头发轮廓、手部动作和表情线条要稳定，避免每镜头风格漂移。"
render_style: "真人动作转描动画，手绘线条，半写实色块，真实运动轨迹。"
performance_profile: ""
editing_rhythm: ""
sound_profile: ""
vfx_profile: "特效以手绘描边、局部色块爆发、影像残影和图形化情绪线为主。"
style_do: "保持人物动作真实、线条稳定、身体比例连续；让动画化服务情绪和叙事。"
style_do_not: "不要把转描做成完全写实照片；不要让线条闪烁到破坏角色识别。"
safety_notes: "避免使用真实演员肖像作为可识别参考；人物外貌应原创化处理。"
