preset_id: "german_expressionism"
preset_type: "director"
name: "德国表现主义"
aliases: "德国表现主义,german expressionism,表现主义电影,扭曲空间,卡里加里,诺斯费拉图"
visual_style_profile: ""
director_style_profile: "把人物心理外化为空间和光影，现实场景可变得斜、尖、压迫，适合怪谈、心理惊悚和权力噩梦。"
cinematography_profile: "倾斜构图、夸张透视、尖锐阴影、门窗框压迫、人物剪影和非自然空间调度。"
lighting_profile: "强明暗对比、硬边投影、斜向阴影和局部高光，暗部像吞噬人物。"
color_palette: "黑白灰、暗蓝、病态绿、深红和冷黄，可按心理状态进行强烈色彩偏移。"
art_direction_profile: ""
render_style: ""
performance_profile: "表演可略带舞台化和形体夸张，手势、站位和眼神体现内心恐惧或权力压迫。"
editing_rhythm: "节奏不必快，但每次构图变化都应带来心理压力；允许突然切入变形空间或影子。"
sound_profile: "低频持续音、尖锐弦乐、空房间混响和突兀静默强化心理异化。"
vfx_profile: "用影子变形、墙面扭曲、非自然投影和空间错位表现心理状态。"
style_do: "让场景、阴影和构图成为人物内心的外化；保持强烈图形化压迫。"
style_do_not: "不要只做普通恐怖滤镜；不要让空间扭曲到观众无法理解人物行动。"
safety_notes: "惊悚和恐怖表达按平台限制控制血腥和心理压迫强度。"
