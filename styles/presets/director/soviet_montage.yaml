preset_id: "soviet_montage"
preset_type: "director"
name: "苏联蒙太奇"
aliases: "苏联蒙太奇,soviet montage,蒙太奇理论,爱森斯坦,库里肖夫,节奏剪辑,冲突剪辑"
visual_style_profile: ""
director_style_profile: "通过镜头并置制造意义，让人物、群体、道具和象征物在剪辑冲突中形成强烈情绪和观点。"
cinematography_profile: "大量关键物件特写、群众反应、重复动作、对比构图、仰拍和机械/身体节奏并置。"
lighting_profile: "可用硬光和强对比突出阶层、权力、机器或集体压力。"
color_palette: "黑白灰、红色警示、工业灰、军绿或高对比色块，服务集体情绪和冲突。"
art_direction_profile: ""
render_style: ""
performance_profile: "表演可以更类型化和群像化，个人动作与集体反应互相放大。"
editing_rhythm: "使用节奏蒙太奇、冲突剪辑、加速重复和象征性并置制造情绪爆点。"
sound_profile: "鼓点、机械声、群体呼吸、脚步、口号感节奏和突停增强剪辑力量。"
vfx_profile: "可使用图形化闪白、重复叠化、文字标语和机械节奏转场。"
style_do: "让每个剪辑并置产生新意义；用道具、表情和群体反应放大主题。"
style_do_not: "不要把蒙太奇变成无意义快剪；不要牺牲故事因果和人物目标。"
safety_notes: "群体、政治、暴力和抗争表达需符合平台安全和合规边界。"
