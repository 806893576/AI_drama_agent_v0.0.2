preset_id: "neon_melancholy"
preset_type: "director"
name: "霓虹疏离电影诗"
aliases: "王家卫,王家卫式,王家卫试,重庆森林,花样年华,霓虹疏离,电影诗"
visual_style_profile: ""
director_style_profile: "都市人物在亲密和疏离之间徘徊，情绪通过错位构图、凝视、重复动作、擦肩而过和时间感表达。"
cinematography_profile: "浅景深、玻璃反射、门框遮挡、长焦压缩、手持游移、慢速凝视和可控的运动拖影。"
lighting_profile: "霓虹、台灯、走廊灯、橱窗光和夜色混合，光源常带强烈色彩方向。"
color_palette: "红、绿、金、深蓝和黑色暗部交织，色彩具有情绪象征而不是自然还原。"
art_direction_profile: ""
render_style: ""
performance_profile: "表演克制、停顿多，台词像说给自己听；眼神、抽烟/喝水/整理衣物等重复小动作承载情绪。"
editing_rhythm: "允许跳切、重复、慢动作感和音乐段落；情绪比事件速度更重要。"
sound_profile: "环境声、旧歌、低声旁白或内心独白可形成孤独感，但不能淹没剧情信息。"
vfx_profile: "只使用胶片颗粒、运动拖影、反射光斑和轻微时间错位感。"
style_do: "把人和城市的距离拍出来；用色彩、音乐和时间感表达未说出口的情绪。"
style_do_not: "不要直接要求模仿在世导演；不要复制具体电影镜头、台词、角色和音乐。"
safety_notes: "用户提到导演姓名时，转译为霓虹、反射、浅景深、错位构图、克制表演和时间拖影等描述性特征。"
