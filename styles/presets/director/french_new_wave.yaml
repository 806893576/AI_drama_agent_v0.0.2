preset_id: "french_new_wave"
preset_type: "director"
name: "法国新浪潮"
aliases: "法国新浪潮,French New Wave,nouvelle vague,跳切,街拍电影,新浪潮"
visual_style_profile: ""
director_style_profile: "以自由、即兴、街头观察和反传统叙事组织场面，人物可直接暴露犹豫、叛逆和生活碎片。"
cinematography_profile: "手持、自然光、街拍、长焦观察、跳切、突然变焦和非传统构图。"
lighting_profile: "自然日光和现场可用光为主，不过度修饰，保留城市真实质感。"
color_palette: "可黑白纪实，也可使用清爽生活色；色彩不追求奢华，而是轻便、现代、真实。"
art_direction_profile: ""
render_style: ""
performance_profile: "表演像即兴发生，台词可有停顿、插话、自我意识和不完美反应。"
editing_rhythm: "允许跳切、省略、突然停顿和段落式结构；情绪和思想可打破传统连续性，但核心剧情需可追踪。"
sound_profile: "现场环境声、街声、轻音乐和旁白可并置，声音不必完全平滑。"
vfx_profile: "不依赖特效，可使用字幕卡、冻结帧和简单图形标注。"
style_do: "保留年轻、自由、街头和实验感；让镜头像在捕捉生活而不是完全控制生活。"
style_do_not: "不要为了实验破坏用户要求的短剧钩子和剧情清楚度。"
safety_notes: "街景、店名、路牌和品牌标识使用虚构或模糊处理。"
