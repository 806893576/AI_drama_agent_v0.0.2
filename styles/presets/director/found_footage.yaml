preset_id: "found_footage"
preset_type: "director"
name: "伪纪录发现影像"
aliases: "found footage,伪纪录,发现影像,手持录像,监控录像,失踪录像,DV影像"
visual_style_profile: ""
director_style_profile: "影像像被事后发现的录像、监控或记录材料，强调现场不可控、信息缺损和镜头持有者的恐惧。"
cinematography_profile: "手持晃动、突然失焦、低清画质、时间戳、监控固定机位、局部遮挡和镜头意外转向。"
lighting_profile: "依赖手电、手机、路灯、监控红外、车灯和现场可用光，暗部信息有限但关键线索必须可见。"
color_palette: "低保真、偏绿监控、冷蓝夜景、过曝手电和噪点黑位，色彩不追求漂亮。"
art_direction_profile: ""
render_style: ""
performance_profile: "表演要像真实记录，呼吸、停顿、打断、镜头外声音和临场反应比完整台词更重要。"
editing_rhythm: "可用录像断点、时间跳跃、文件损坏、监控切换和沉默空段制造悬念。"
sound_profile: "现场声、风声、脚步、呼吸、远处异响、设备摩擦声和音频爆裂是主要恐怖来源。"
vfx_profile: "特效使用压缩噪点、画面撕裂、时间戳、信号丢失和红外过曝，避免华丽数字特效。"
style_do: "保持影像来源可信；让信息缺损服务悬念而不是遮挡剧情。"
style_do_not: "不要过度晃动导致无法观看；不要用无意义噪点替代线索。"
safety_notes: "恐怖、失踪、跟踪和入侵题材避免提供现实可执行伤害或犯罪细节。"
