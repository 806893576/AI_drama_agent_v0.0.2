preset_id: "documentary_realism"
preset_type: "director"
name: "纪实现实主义"
aliases: "现实主义,纪实,手持纪实,生活流,自然主义"
visual_style_profile: ""
director_style_profile: "像观察真实生活一样组织场面，少用炫技，重视人物行动动机、环境阻力和现场偶然感。"
cinematography_profile: "平视或轻微手持，跟随人物移动，保持空间关系清楚，关键冲突不切得过碎。"
lighting_profile: "自然动机光，窗光、顶光、街灯和室内实用灯为主，保留生活质感。"
color_palette: "接近真实环境色，略微压低饱和，避免过度糖水滤镜。"
art_direction_profile: ""
render_style: ""
performance_profile: "表演克制、口语化，动作从人物目的出发，停顿和打断要像真实对话。"
editing_rhythm: "剪辑跟随信息和情绪，不为了快而快；允许短暂停顿建立真实感。"
sound_profile: "保留环境底噪、脚步、衣料、门声和空间混响，音乐少而准。"
vfx_profile: "原则上不使用显眼特效，只做必要屏幕和信息呈现。"
style_do: "让镜头像在场见证事件；保留人物真实反应和环境细节。"
style_do_not: "不要过度摆拍、过度滤镜、过度戏剧化慢动作。"
safety_notes: "涉及真实地点和职业时，避免出现可识别真实机构、商标和敏感个人信息。"
