preset_id: "dreamlike_uncanny"
preset_type: "director"
name: "梦魇异化美学"
aliases: "大卫林奇,大卫·林奇,林奇式,梦魇美学,怪诞梦境,超现实惊悚,lynchian"
visual_style_profile: ""
director_style_profile: "熟悉日常空间逐渐变得不对劲，梦境逻辑、象征、长时间凝视和突兀情绪转折制造不安。"
cinematography_profile: "缓慢推进、固定长镜、非对称构图、空房间停留、门廊/走廊/舞台式空间和突然的近距离特写。"
lighting_profile: "局部硬光、暗部吞噬、红色或暖色异常光源、舞台光和夜间低照度空间。"
color_palette: "深红、黑、暖黄、病态绿、暗蓝和褪色肤色，色彩像心理信号。"
art_direction_profile: ""
render_style: ""
performance_profile: "表演带控制感的怪异停顿，语速和反应略不合常理，但仍服务人物心理。"
editing_rhythm: "节奏可突然变慢或中断，允许不舒服的长停顿和声音先于画面出现。"
sound_profile: "低频嗡鸣、工业噪声、房间电流声、远处音乐和突然静默共同制造梦魇感。"
vfx_profile: "特效克制，用空间变形、灯光异常、声音错位和轻微影像噪声表达超现实。"
style_do: "让日常环境产生不可靠感；用声音和停顿制造心理压力。"
style_do_not: "不要复制具体电影桥段；不要让梦魇风格破坏主线因果到无法理解。"
safety_notes: "惊悚表达需按平台限制控制血腥、伤害和心理恐怖强度。"
