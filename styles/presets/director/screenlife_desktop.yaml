preset_id: "screenlife_desktop"
preset_type: "director"
name: "桌面屏幕电影"
aliases: "screenlife,桌面电影,屏幕电影,电脑桌面,手机屏幕,聊天窗口,直播界面"
visual_style_profile: ""
director_style_profile: "故事主要通过手机、电脑、监控、聊天窗口、直播和网页界面推进，人物行动被屏幕选择和信息延迟塑造。"
cinematography_profile: "镜头表现为屏幕录制、手机竖屏、弹窗、光标、聊天气泡、监控画面和多窗口并置。"
lighting_profile: "人物画面多由屏幕光、房间暗光和摄像头低照度组成，界面亮度承担情绪节奏。"
color_palette: "界面主色克制，警示色用于关键消息；避免过多彩色窗口分散阅读。"
art_direction_profile: ""
render_style: ""
performance_profile: "表演由停顿、输入又删除、眼神看屏幕、手指操作和语音/视频延迟体现。"
editing_rhythm: "信息弹出、输入节奏、窗口切换和已读未回构成剪辑节奏；关键消息留足阅读时间。"
sound_profile: "通知声、键盘声、语音压缩、视频卡顿、环境底噪和突然静默非常关键。"
vfx_profile: "特效主要是虚构UI、聊天窗口、地图、监控噪点、加载错误和屏幕故障。"
style_do: "所有界面必须清楚可读；屏幕信息必须直接推动剧情和悬念。"
style_do_not: "不要使用真实软件界面、真实平台logo或过密文字；不要让观众看不清关键消息。"
safety_notes: "聊天、账号、地图、网页、软件、品牌和个人资料均需虚构；避免真实隐私信息。"
