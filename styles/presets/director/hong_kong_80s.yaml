preset_id: "hong_kong_80s"
preset_type: "director"
name: "80年代港片动势"
aliases: "80年代港片,港片,港产片,香港电影,英雄本色,警匪港片"
visual_style_profile: ""
director_style_profile: "强烈城市动势、江湖情义、危险街头和高密度冲突并存，镜头调度直接、热烈、有现场爆发力。"
cinematography_profile: "大胆低机位、手持跟拍、快速横移、窄巷纵深、反应特写和动作轴线清楚的群像调度。"
lighting_profile: "钨丝暖光、霓虹侧光、街灯、烟雾和强反差夜景，人物常处在明暗交界。"
color_palette: "猩红、霓虹蓝、钨丝黄、深黑、旧楼灰和雨夜反射。"
art_direction_profile: ""
render_style: ""
performance_profile: "表演外放、义气感强，眼神和停顿有压迫，爆发点干脆，情绪不拖泥带水。"
editing_rhythm: "冲突段落节奏快，动作和反应交替切；情义段落允许短暂停顿和凝视。"
sound_profile: "城市噪声、摩托/汽车、霓虹电流感、脚步和现场打斗声清楚，音乐可带复古合成器或粤语流行气质。"
vfx_profile: "以实拍感烟雾、火花、招牌闪烁、胶片颗粒为主，不做现代科幻式夸张特效。"
style_do: "保持街头现场感、霓虹光、动作方向和人物义气张力。"
style_do_not: "不要把港片风格简化成红蓝滤镜；不要模仿具体电影角色、台词和标志性造型。"
safety_notes: "枪械、暴力和犯罪内容按平台安全规则降级处理，避免可执行犯罪细节。"
