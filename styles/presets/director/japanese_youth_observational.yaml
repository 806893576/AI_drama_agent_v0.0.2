preset_id: "japanese_youth_observational"
preset_type: "director"
name: "日式青春观察"
aliases: "日式青春导演,青春片,校园青春,岩井俊二感,夏日青春导演"
visual_style_profile: ""
director_style_profile: "以细腻观察捕捉青春期的犹豫、错过和微小勇气，重视日常空间与未说出口的情绪。"
cinematography_profile: "平视、侧脸、背影、窗边、走廊长焦、远处观察和安静空镜结合。"
lighting_profile: "自然日光、窗光、黄昏逆光、雨天散射光，光线像季节记忆。"
color_palette: "浅蓝、白、草绿、淡黄、夕阳橙和低饱和生活色。"
art_direction_profile: ""
render_style: ""
performance_profile: "表演内收，台词少而准，停顿、低头、回避视线和突然直视承担情绪。"
editing_rhythm: "节奏留白，不急于解释；用空镜、环境声和短暂停顿让观众感受情绪。"
sound_profile: "风、蝉鸣、雨、远处列车、校园广播和轻音乐形成季节性。"
vfx_profile: "只使用自然光斑、雨滴、风动、轻微胶片感，不做奇观特效。"
style_do: "把青春的细微变化拍清楚；环境必须参与情绪表达。"
style_do_not: "不要把青春拍成过度偶像剧摆拍；不要使用成人化凝视。"
safety_notes: "涉及校园与未成年人时，镜头和表演保持非性化、健康、尊重。"
