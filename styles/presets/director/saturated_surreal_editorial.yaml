preset_id: "saturated_surreal_editorial"
preset_type: "director"
name: "高饱和超现实棚拍"
aliases: "大卫拉夏佩尔,大卫·拉夏佩尔,LaChapelle,超现实摄影,高饱和棚拍,商业摄影大片"
visual_style_profile: ""
director_style_profile: "像戏剧化商业摄影和音乐视频结合，人物被放入夸张布景、强色彩和象征道具中，画面有强烈摆拍感。"
cinematography_profile: "正面构图、广角夸张、群像摆位、静态 tableau 和精确人物姿态，画面像可阅读的巨幅摄影。"
lighting_profile: "强控制棚拍光、彩色补光、亮面高光、清晰轮廓和夸张反射。"
color_palette: "高饱和糖果色、补色碰撞、亮粉、青蓝、金黄、鲜红，黑位干净。"
art_direction_profile: ""
render_style: ""
performance_profile: "表演姿态化、外放，动作像时尚大片定格，表情明确且略带讽刺或荒诞。"
editing_rhythm: "节奏像音乐视频，强视觉段落之间切换明确，每个镜头都有海报感。"
sound_profile: "可使用强节拍音乐、夸张环境声和舞台化音效，但对白信息保持清楚。"
vfx_profile: "允许超现实道具、夸张色彩、舞台烟雾和象征性视觉奇观，但不改变剧情动作。"
style_do: "让每个关键镜头都像高饱和杂志大片；道具和色彩承担讽刺或情绪功能。"
style_do_not: "不要直接要求模仿在世摄影师；不要使用真实品牌、明星脸或商业广告标识。"
safety_notes: "用户提到摄影师姓名时，转译为高饱和、棚拍、超现实布景、强补色和 tableau 构图等描述性特征。"
