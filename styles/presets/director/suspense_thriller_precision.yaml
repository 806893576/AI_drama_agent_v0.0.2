preset_id: "suspense_thriller_precision"
preset_type: "director"
name: "精密悬疑惊悚"
aliases: "悬疑惊悚,心理悬疑,精密悬疑,冷峻惊悚,thriller"
visual_style_profile: ""
director_style_profile: "用信息差、空间遮挡、视线方向和声音线索制造悬念，所有镜头都服务线索投放和误导。"
cinematography_profile: "稳定构图、慢推、窥视视角、门缝/反射/监控视角和关键物件特写。"
lighting_profile: "低照度、冷光、局部亮区、阴影遮挡和可疑光源，保持线索可见。"
color_palette: "冷灰、暗蓝、病态绿、少量警示红或钨丝黄。"
art_direction_profile: ""
render_style: ""
performance_profile: "表演克制，微表情和视线变化重要，台词隐藏信息但不能故弄玄虚。"
editing_rhythm: "前段克制积累，线索出现时短促切换；反转点给足观众识别时间。"
sound_profile: "低频氛围、远处异响、钟表/电流/脚步等细节声作为线索。"
vfx_profile: "只使用监控噪点、屏幕信息、微弱光影异常等叙事性特效。"
style_do: "每个镜头要么提供线索、误导、压力或人物心理变化。"
style_do_not: "不要用无意义惊吓替代悬念；不要为了风格牺牲线索可读性。"
safety_notes: "惊悚和犯罪内容避免提供现实可执行伤害、跟踪、入侵等细节。"
