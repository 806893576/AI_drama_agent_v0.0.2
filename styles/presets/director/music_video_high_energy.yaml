preset_id: "music_video_high_energy"
preset_type: "director"
name: "音乐视频高能节奏"
aliases: "MV风,音乐视频,高能剪辑,潮流短视频,快剪"
visual_style_profile: ""
director_style_profile: "用节拍、姿态、转场和视觉钩子推动情绪，适合强爽点、反击、登场和商业化短视频段落。"
cinematography_profile: "快速推拉、旋转、甩镜、低角度英雄镜头、节拍点特写和运动转场。"
lighting_profile: "强色彩灯、轮廓光、频闪感、舞台光和局部高光，注意平台观看清晰度。"
color_palette: "高对比、高饱和，可按人物阵营设置主色和反色。"
art_direction_profile: ""
render_style: ""
performance_profile: "动作明确、姿态有力量，台词节奏踩点，眼神和转身要形成短视频钩子。"
editing_rhythm: "快剪、节拍点切换、动作匹配转场和强反应镜头，但关键信息必须留够阅读时间。"
sound_profile: "音乐节拍、低频冲击、转场音效和动作声结合。"
vfx_profile: "可使用节拍闪白、速度拖尾、图形转场和轻量粒子，但不能遮挡人物和字幕。"
style_do: "让每个反击点、登场点和情绪爆点有节拍记忆。"
style_do_not: "不要快到看不懂剧情；不要用特效覆盖表演和对白。"
safety_notes: "高刺激视听需避免过强频闪和可能引发不适的画面节奏。"
