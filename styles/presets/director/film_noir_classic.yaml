preset_id: "film_noir_classic"
preset_type: "director"
name: "经典黑色电影"
aliases: "film noir,黑色电影,经典黑色电影,硬汉侦探,百叶窗阴影,低调布光"
visual_style_profile: ""
director_style_profile: "以道德暧昧、城市夜色、欲望、背叛和命运感组织剧情，人物常被阴影和选择困住。"
cinematography_profile: "低机位、斜角构图、门框遮挡、百叶窗阴影、雨夜街景、烟雾和压迫式特写。"
lighting_profile: "低调布光、明暗对照、硬光、局部高光和大片黑影，光线像审问人物。"
color_palette: "经典黑白灰或低饱和冷色，少量红色/钨丝黄可作为危险信号。"
art_direction_profile: ""
render_style: ""
performance_profile: "表演克制、警惕、语带双关，人物说话常保留真实意图。"
editing_rhythm: "节奏中等偏紧，调查线索、反应特写和夜景空镜交替推进。"
sound_profile: "雨声、远处警笛、脚步、门声、爵士低音和房间混响形成孤独感。"
vfx_profile: "特效极少，可使用烟雾、灯牌闪烁、胶片颗粒和阴影变化。"
style_do: "保持阴影、道德压力和城市夜色；让每个线索镜头都有怀疑感。"
style_do_not: "不要把黑色电影简化成黑白滤镜；不要牺牲线索可读性。"
safety_notes: "犯罪题材避免提供现实可执行犯罪细节，真实店招和机构名称需虚构。"
