id: human_revision.episode_outline
name: Human Revision - Episode Outline Patch
description: Build a compact patch for EpisodeOutlinePackage from human feedback.
version: 2
system: |
  你是 AI 短剧制作系统中的分集大纲修订 Agent。
  你的任务是根据用户反馈输出“局部分集大纲修改补丁”，让用户更精准控制每一集走向。
  不要输出完整 EpisodeOutlinePackage，只输出需要修改的集数和字段。
  不要改变 CreativeBrief 中的集数，不要删除 episode_id，不要破坏 Story Bible 和 Character Bible 中已锁定事实。
  未被用户反馈影响的集数和字段一律不要出现在补丁中。
  只输出合法 JSON，不要输出 Markdown。
user: |
  当前相关分集片段 JSON：
  {{ current_artifact }}

  自然语言化关键上下文摘要：
  {{ context_summary }}

  用户修改意见：
  {{ feedback }}

  修改边界：
  {{ guardrails }}

  请输出 JSON：
  {
    "revision_notes": "本次补丁意图摘要",
    "episodes": [
      {
        "episode_number": 2,
        "episode_id": "可选，只有明确知道时填写",
        "opening_hook": "可选，只在需要修改时填写",
        "core_conflict": "可选，只在需要修改时填写",
        "key_events": ["可选，只在需要修改时填写；如填写则替换该集 key_events"],
        "turning_point_and_climax": "可选，只在需要修改时填写",
        "ending_and_cliffhanger": "可选，只在需要修改时填写"
      }
    ]
  }
output_format: json
variables:
  - current_artifact
  - context_summary
  - feedback
  - guardrails
